<aside class="sidebar">

  <!-- COMPANY -->
  <ng-container *ngIf="variant === 'company'">

    <div class="sidebar-group">
      <span class="sidebar-label">General</span>

      <a
        routerLink="/company/company-dashboard"
        routerLinkActive="active">
        <span class="dot"></span>Dashboard
      </a>

      <a
        routerLink="/company/profile-company"
        routerLinkActive="active">
        <span class="dot"></span>Company Profile
      </a>
    </div>

    <div class="sidebar-group">
      <span class="sidebar-label">Hiring</span>

      <a
        routerLink="/company/company-post-job"
        routerLinkActive="active">
        <span class="dot"></span>Post a Job
      </a>

      <a
        routerLink="/company/company-manage-jobs"
        routerLinkActive="active">
        <span class="dot"></span>Manage Jobs
      </a>

      <a
        routerLink="/company/company-applicants"
        routerLinkActive="active">
        <span class="dot"></span>Applicants
      </a>

      <a
        routerLink="/company/company-interviews"
        routerLinkActive="active">
        <span class="dot"></span>Interviews
      </a>
    </div>

  </ng-container>


  <!-- JOB SEEKER -->
<ng-container *ngIf="variant === 'seeker'">
    <div class="sidebar-group">
      <span class="sidebar-label">General</span>
      <a routerLink="/seeker/jobseeker-dashboard" routerLinkActive="active"><span class="dot"></span>Dashboard</a>
      <a routerLink="/job/all-jobs" routerLinkActive="active"><span class="dot"></span>Browse Jobs</a>
      <a routerLink="/job/saved-jobs" routerLinkActive="active"><span class="dot"></span>Saved Jobs</a>
    </div>
    <div class="sidebar-group">
      <span class="sidebar-label">Career</span>
      <a routerLink="/application/jobseeker-applications" routerLinkActive="active"><span class="dot"></span>My Applications</a>
      <a routerLink="/seeker/interviews" routerLinkActive="active"><span class="dot"></span>Interviews</a>
      <a routerLink="/seeker/profile-jobseeker" routerLinkActive="active"><span class="dot"></span>My Profile</a>
      <a routerLink="/seeker/resume-photo" routerLinkActive="active"><span class="dot"></span>Resume &amp; Photo</a>
    </div>
  </ng-container>


  <!-- ADMIN -->
  <ng-container *ngIf="variant === 'admin'">

    <div class="sidebar-group">
      <span class="sidebar-label">Overview</span>

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active">
        <span class="dot"></span>Dashboard
      </a>
    </div>

    <div class="sidebar-group">
      <span class="sidebar-label">Directory</span>

      <a
        routerLink="/admin/jobseekers"
        routerLinkActive="active">
        <span class="dot"></span>Job Seekers
      </a>

      <a
        routerLink="/admin/companies"
        routerLinkActive="active">
        <span class="dot"></span>Companies
      </a>
    </div>

    <div class="sidebar-group">
      <span class="sidebar-label">Marketplace</span>

      <a
        routerLink="/admin/jobs"
        routerLinkActive="active">
        <span class="dot"></span>Jobs
      </a>

      <a
        routerLink="/admin/applications"
        routerLinkActive="active">
        <span class="dot"></span>Applications
      </a>
    </div>

    <div class="sidebar-group">
      <span class="sidebar-label">System</span>

      <a
        routerLink="/admin/profile"
        routerLinkActive="active">
        <span class="dot"></span>Admin Profile
      </a>
    </div>

  </ng-container>

</aside>
